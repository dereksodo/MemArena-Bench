# Medium GPU integration run: 10 agents, 5 days, roughly 5K text tokens per
# ego agent per day. This keeps the same per-agent/day text density as
# memarena_5a10d_5k.yaml while increasing the social graph size.

base: memarena_base.yaml

llm:
  endpoint: "http://127.0.0.1:8000/v1"
  api_key: "EMPTY"
  model: "qwen3"
  temperature: 0.7
  max_tokens: 512
  timeout_seconds: 600
  max_retries: 3
  concurrency: 32
  unlimited_tokens: true

graph:
  n_agents: 10
  model: watts_strogatz
  seed: 42
  alpha: 0.33
  layers:
    - size: 5
      beta: 0.30
      k: 4
      weight: 1.0
    - size: 10
      beta: 0.15
      k: 4
      weight: 0.33

n_events: 15
sessions_per_day_per_agent: 4
target_tokens: 0
time_range: [0.0, 5.0]
day_length: 1.0
